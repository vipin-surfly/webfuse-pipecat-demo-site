<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Insurance — Get a quote</title>
  <script>
    (function (w, e, b, f, u, s) {
    w[f] = w[f] || {
        initSpace: function () {
            return new Promise(resolve => {
                w[f].q = arguments;
                w[f].resolve = resolve;
            });
        },
    };
    u = e.createElement(b);
    s = e.getElementsByTagName(b)[0];
    u.async = 1;
    u.src = 'https://webfu.se/surfly.js';
    s.parentNode.insertBefore(u, s);
})(window, document, 'script', 'webfuse');

webfuse.initSpace(
    'wk_5ogniHUIu5Z0j_SXhfsByCavekz_PeCv',
    '3879',
    {
        // Route session starts through the consent dialog: the customer's
        // click refreshes the browser's user gesture (keeps the voice alive)
        // and lets the widget run its cookie trick so the session EMBEDS in
        // this page instead of navigating it away.
        // NOTE: do NOT enable session_autorestore_enabled — with stale
        // restore cookies the widget REFUSES to start new sessions.
        session_start_confirmation: true
    },
).then(space => {
        // Expose the Space object for the voice widget: only the Space has
        // .session() — the webfuse global itself only has initSpace.
        window.__wfSpace = space;
        space.button({ position: 'bottomleft' });
    })
    .catch(error => {
        console.error('Failed:', error);
    });
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #f4f6fa; color: #1c2333;
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      background: #1c2333; color: #fff; padding: 1rem 2rem;
      display: flex; align-items: center; gap: .6rem;
    }
    header .logo { width: 28px; height: 28px; border-radius: 6px;
                   background: #4da3ff; display: grid; place-items: center;
                   font-weight: 700; }
    main { max-width: 26rem; margin: 3rem auto; padding: 0 1.2rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .2rem; }
    p.sub { color: #5a6478; margin: 0 0 2rem; }
    form { display: grid; gap: 1.1rem; }
    label { display: grid; gap: .35rem; font-weight: 600; font-size: .9rem; }
    input, select {
      font: inherit; padding: .65rem .8rem; border: 1px solid #c9d2e0;
      border-radius: 8px; background: #fff;
    }
    button.primary {
      font: inherit; font-weight: 600; padding: .75rem; border: 0;
      border-radius: 8px; background: #2463eb; color: #fff; cursor: pointer;
    }
    button.primary:hover { background: #1d55d4; }
    #success {
      display: none; margin-top: 1.4rem; padding: .9rem 1.1rem;
      background: #e8f8ee; border: 1px solid #b7e4c7; color: #14532d;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header><div class="logo">A</div> Acme Insurance</header>
  <main>
    <h1>Get your quote</h1>
    <p class="sub">Two minutes, no paperwork. Or just ask the voice agent to fill this for you.</p>
    <form id="quote-form">
      <label>Full name
        <input id="fullname" name="fullname" autocomplete="name" placeholder="Jane Doe">
      </label>
      <label>Email
        <input id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com">
      </label>
      <label>Plan
        <select id="plan" name="plan">
          <option value="">Choose a plan…</option>
          <option value="basic">Basic — $19/mo</option>
          <option value="standard">Standard — $39/mo</option>
          <option value="premium">Premium — $79/mo</option>
        </select>
      </label>
      <button class="primary" id="submit-btn" type="submit">Get my quote</button>
    </form>
    <div id="success">Thanks! Your quote is on its way to your inbox.</div>
  </main>

  <!-- The voice agent: one <script> tag, like any analytics or chat widget. -->
  <script src="agent.js?v=14"></script>
</body>
</html>
