<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Insurance — Get a quote</title>
  <script>
    (function (w, e, b, f, u, s) {
    w[f] = w[f] || {
        initSpace: function () {
            return new Promise(resolve => {
                w[f].q = arguments;
                w[f].resolve = resolve;
            });
        },
    };
    u = e.createElement(b);
    s = e.getElementsByTagName(b)[0];
    u.async = 1;
    u.src = 'https://webfu.se/surfly.js';
    s.parentNode.insertBefore(u, s);
})(window, document, 'script', 'webfuse');

webfuse.initSpace(
    'wk_5ogniHUIu5Z0j_SXhfsByCavekz_PeCv',
    '3879',
    {
        // No extra settings: the customer taps the "Get Live Help" button
        // themselves — a real user gesture — so the widget runs its normal,
        // proven start path (popup + cookie trick → session embeds here).
        // NOTE: do NOT enable session_autorestore_enabled — with stale
        // restore cookies the widget REFUSES to start new sessions.
    },
).then(space => {
        // Expose the Space object for the voice widget: only the Space has
        // .session() — the webfuse global itself only has initSpace.
        window.__wfSpace = space;
        //space.button({ position: 'bottomleft' });
    })
    .catch(error => {
        console.error('Failed:', error);
    });
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #f4f6fa; color: #1c2333;
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      background: #1c2333; color: #fff; padding: 1rem 2rem;
      display: flex; align-items: center; gap: .6rem;
    }
    header .logo { width: 28px; height: 28px; border-radius: 6px;
                   background: #4da3ff; display: grid; place-items: center;
                   font-weight: 700; }
    main { max-width: 26rem; margin: 3rem auto; padding: 0 1.2rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .2rem; }
    p.sub { color: #5a6478; margin: 0 0 2rem; }
    form { display: grid; gap: 1.1rem; }
    label { display: grid; gap: .35rem; font-weight: 600; font-size: .9rem; }
    input, select {
      font: inherit; padding: .65rem .8rem; border: 1px solid #c9d2e0;
      border-radius: 8px; background: #fff;
    }
    button.primary {
      font: inherit; font-weight: 600; padding: .75rem; border: 0;
      border-radius: 8px; background: #2463eb; color: #fff; cursor: pointer;
    }
    button.primary:hover { background: #1d55d4; }
    #success {
      display: none; margin-top: 1.4rem; padding: .9rem 1.1rem;
      background: #e8f8ee; border: 1px solid #b7e4c7; color: #14532d;
      border-radius: 8px;
    }
    /* How-it-works strip: the whole FDE story in one glance */
    .how {
      margin: 0 0 2rem; background: #fff; border: 1px solid #dbe3ee;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(28,35,51,.08);
    }
    .how .shot {
      display: block; width: 100%; height: auto;
    }
    .how .steps {
      display: flex; gap: .8rem; padding: .8rem 1rem; border-top: 1px solid #eef2f7;
    }
    .how .step { flex: 1; text-align: center; font-size: .78rem; color: #1c2333; }
    .how .step b { display: block; font-size: .95rem; margin-bottom: .15rem; }
    .how .n { display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem;
              border-radius: 50%; background: #2463eb; color: #fff; font-weight: 700;
              margin-bottom: .3rem; }
    .how .step:nth-child(2) .n { background: #f59e0b; }
    .how .step:nth-child(3) .n { background: #16a34a; }
  </style>
</head>
<body>
  <header><div class="logo">A</div> Acme Insurance</header>
  <main>
    <h1>Get your quote</h1>
    <p class="sub">Two minutes, no paperwork. Or just ask the voice agent to fill this for you.</p>

    <!-- Eye-catching "screenshot" of the flow: what the voice FDE does -->
    <figure class="how" style="margin:0 0 2rem">
      <svg class="shot" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Voice agent flow: you talk, a secure overlay opens, the form fills itself">
        <rect width="800" height="300" fill="#0f1626"/>
        <rect x="60" y="40" width="200" height="150" rx="10" fill="#1c2333" stroke="#31405c"/>
        <rect x="60" y="40" width="200" height="26" rx="10" fill="#31405c"/>
        <circle cx="75" cy="53" r="4" fill="#ff5f57"/><circle cx="89" cy="53" r="4" fill="#febc2e"/><circle cx="103" cy="53" r="4" fill="#28c840"/>
        <text x="160" y="100" text-anchor="middle" font-size="34">🎙</text>
        <rect x="90" y="118" width="140" height="10" rx="5" fill="#4da3ff" opacity=".9"/>
        <rect x="90" y="136" width="100" height="10" rx="5" fill="#4da3ff" opacity=".55"/>
        <rect x="90" y="154" width="120" height="10" rx="5" fill="#4da3ff" opacity=".3"/>
        <text x="160" y="185" text-anchor="middle" font-size="12" fill="#8fa2c2">"Fill this for me — Jane, jane@acme.com, basic"</text>

        <text x="290" y="120" font-size="22" fill="#4da3ff">→</text>
        <text x="290" y="120" font-size="13" fill="#8fa2c2"></text>
        <text x="285" y="145" font-size="11" fill="#8fa2c2" font-family="monospace">start_secure_session</text>

        <rect x="330" y="40" width="200" height="150" rx="10" fill="#1c2333" stroke="#31405c"/>
        <rect x="330" y="40" width="200" height="26" rx="10" fill="#31405c"/>
        <text x="430" y="58" text-anchor="middle" font-size="11" fill="#cfe0ff">🔒 Secure session overlay</text>
        <rect x="345" y="80" width="170" height="14" rx="4" fill="#24406e"/>
        <rect x="345" y="102" width="170" height="14" rx="4" fill="#24406e"/>
        <rect x="345" y="124" width="170" height="14" rx="4" fill="#24406e"/>
        <rect x="345" y="80" width="96" height="14" rx="4" fill="#4da3ff"/>
        <rect x="345" y="102" width="120" height="14" rx="4" fill="#4da3ff"/>
        <rect x="352" y="124" width="60" height="14" rx="7" fill="#f59e0b"/>
        <rect x="425" y="124" width="46" height="14" rx="7" fill="#4da3ff"/>
        <rect x="482" y="124" width="24" height="14" rx="7" fill="#16a34a"/>
        <text x="430" y="185" text-anchor="middle" font-size="12" fill="#8fa2c2">same page, same tab — your mic stays on</text>

        <text x="552" y="120" font-size="22" fill="#16a34a">✓</text>

        <rect x="580" y="40" width="160" height="150" rx="10" fill="#1c2333" stroke="#31405c"/>
        <rect x="580" y="40" width="160" height="26" rx="10" fill="#31405c"/>
        <text x="660" y="58" text-anchor="middle" font-size="11" fill="#cfe0ff">Quote ready</text>
        <rect x="600" y="85" width="120" height="34" rx="8" fill="#16a34a" opacity=".18"/>
        <text x="660" y="107" text-anchor="middle" font-size="13" fill="#28c840">✓ Submitted</text>
        <text x="660" y="150" text-anchor="middle" font-size="22">🤝</text>
        <text x="660" y="185" text-anchor="middle" font-size="12" fill="#8fa2c2">filled for you, while you watched</text>

        <text x="400" y="250" text-anchor="middle" font-size="15" fill="#e8eefb" font-weight="600">Pipecat voice agent + Webfuse co-browsing — on your own website</text>
        <text x="400" y="272" text-anchor="middle" font-size="12" fill="#8fa2c2">one &lt;script&gt; tag · raw PCM websocket · agent acts in a secure overlay of THIS page</text>
      </svg>
      <figcaption class="steps">
        <div class="step"><span class="n">1</span><b>Talk</b>ask the agent to fill the form</div>
        <div class="step"><span class="n">2</span><b>Watch</b>a secure overlay opens — same page</div>
        <div class="step"><span class="n">3</span><b>Done</b>it fills the form while you keep talking</div>
      </figcaption>
    </figure>

    <form id="quote-form">
      <label>Full name
        <input id="fullname" name="fullname" autocomplete="name" placeholder="Jane Doe">
      </label>
      <label>Email
        <input id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com">
      </label>
      <label>Plan
        <select id="plan" name="plan">
          <option value="">Choose a plan…</option>
          <option value="basic">Basic — $19/mo</option>
          <option value="standard">Standard — $39/mo</option>
          <option value="premium">Premium — $79/mo</option>
        </select>
      </label>
      <button class="primary" id="submit-btn" type="submit">Get my quote</button>
    </form>
    <div id="success">Thanks! Your quote is on its way to your inbox.</div>
  </main>

  <!-- The voice agent: one <script> tag, like any analytics or chat widget. -->
  <!-- Where the Webfuse co-browsing session mounts when the agent asks for
       hands: session.start('#agent-session-frame') embeds the session right
       here. Hidden until it starts; sits just under the floating mic. -->
  <iframe id="agent-session-frame"
          allow="microphone https://webfu.se; camera https://webfu.se"
          style="position:fixed;inset:0;width:100%;height:100%;border:0;
                 z-index:2147483546;display:none"
          title="Secure session"></iframe>

  <script src="agent.js?v=20"></script>
</body>
</html>
