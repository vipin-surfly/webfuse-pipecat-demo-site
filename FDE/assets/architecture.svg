<svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="How it works: the customer opens a session link, the Webfuse session runs the site with the Voice Agent extension, the extension popup connects to the Pipecat bot, which hears and speaks via OpenAI Realtime and drives the session through the Webfuse Session MCP">
  <rect width="920" height="400" fill="#0f1626"/>
  <text x="460" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#e8eefb">How it works — a Space with a voice, no code on your site</text>

  <!-- Customer -->
  <rect x="30" y="70" width="240" height="150" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="150" y="94" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="700">Customer</text>
  <rect x="48" y="108" width="204" height="30" rx="6" fill="#24406e"/>
  <text x="150" y="127" text-anchor="middle" font-size="10.5" fill="#cfe0ff">opens one link (chat / email / phone)</text>
  <rect x="48" y="144" width="204" height="30" rx="6" fill="#0f1626" stroke="#31405c"/>
  <text x="150" y="163" text-anchor="middle" font-size="10.5" fill="#9fd0ff" font-family="monospace">webfu.se/+pipecat-poc/</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#8fa2c2">mic + speakers · nothing installed</text>

  <!-- Webfuse session (cloud browser) -->
  <rect x="330" y="58" width="270" height="250" rx="12" fill="#16239a" fill-opacity="0.12"/>
  <rect x="330" y="58" width="270" height="250" rx="12" fill="none" stroke="#2463eb" stroke-dasharray="6 4"/>
  <text x="465" y="82" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="700">Webfuse session — cloud browser</text>
  <rect x="350" y="96" width="230" height="26" rx="8" fill="#31405c"/>
  <text x="365" y="113" font-size="10" fill="#cfe0ff">session top bar</text>
  <circle cx="372" cy="109" r="9" fill="#2463eb"/>
  <text x="372" y="113" text-anchor="middle" font-size="9">🎙</text>
  <text x="386" y="113" font-size="9" fill="#9fd0ff">Voice Agent (extension)</text>
  <!-- the proxied site -->
  <rect x="350" y="130" width="230" height="76" rx="8" fill="#0f1626" stroke="#31405c"/>
  <text x="365" y="148" font-size="10" fill="#cfe0ff" font-weight="700">your site, proxied</text>
  <rect x="362" y="158" width="206" height="12" rx="4" fill="#24406e"/>
  <rect x="362" y="176" width="150" height="12" rx="4" fill="#24406e"/>
  <text x="365" y="200" font-size="9" fill="#8fa2c2">the customer watches every move</text>
  <!-- popup -->
  <rect x="350" y="214" width="230" height="70" rx="8" fill="#1c2333" stroke="#31405c"/>
  <text x="365" y="232" font-size="10" fill="#cfe0ff" font-weight="700">🎙 extension popup</text>
  <text x="365" y="250" font-size="9.5" fill="#8fa2c2">● Connected — just talk</text>
  <text x="365" y="268" font-size="9.5" fill="#8fa2c2">knows its session id</text>

  <!-- Bot -->
  <rect x="30" y="260" width="240" height="120" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="150" y="284" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="700">Pipecat bot — bot.py (hosted)</text>
  <text x="150" y="306" text-anchor="middle" font-size="10.5" fill="#8fa2c2">ears + brain + voice: OpenAI Realtime</text>
  <text x="150" y="324" text-anchor="middle" font-size="10.5" fill="#8fa2c2">gpt-realtime-2.1 · reasoning minimal</text>
  <text x="150" y="346" text-anchor="middle" font-size="10.5" fill="#8fa2c2">14 session tools bound to the popup's session</text>
  <text x="150" y="366" text-anchor="middle" font-size="10" fill="#8fa2c2">wss endpoint · PCM 16 kHz both ways</text>

  <!-- OpenAI -->
  <rect x="700" y="70" width="190" height="70" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="795" y="94" text-anchor="middle" font-size="12" fill="#cfe0ff" font-weight="700">OpenAI Realtime</text>
  <text x="795" y="114" text-anchor="middle" font-size="10" fill="#8fa2c2">speech in → speech out</text>

  <!-- Session MCP -->
  <rect x="700" y="160" width="190" height="70" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="795" y="184" text-anchor="middle" font-size="12" fill="#cfe0ff" font-weight="700">Session MCP</text>
  <text x="795" y="204" text-anchor="middle" font-size="10" fill="#8fa2c2">see_domSnapshot · act_type</text>
  <text x="795" y="220" text-anchor="middle" font-size="10" fill="#8fa2c2">act_click · act_select …</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4da3ff"/>
    </marker>
    <marker id="g2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#28c840"/>
    </marker>
  </defs>

  <!-- customer <-> session -->
  <path d="M150 220 C 215 235, 260 245, 328 258" stroke="#4da3ff" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="228" y="230" font-size="9.5" fill="#8fa2c2">screens + clicks streamed</text>

  <!-- popup <-> bot: voice wire -->
  <path d="M350 262 C 300 300, 300 320, 272 330" stroke="#4da3ff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M272 344 C 330 330, 330 300, 348 278" stroke="#4da3ff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="305" y="306" font-size="9.5" fill="#9fd0ff">🎙 PCM voice wire (BOT_WS_URL)</text>

  <!-- bot <-> OpenAI -->
  <line x1="270" y1="300" x2="700" y2="105" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="480" y="196" font-size="9.5" fill="#8fa2c2">realtime WS</text>

  <!-- bot <-> Session MCP -->
  <line x1="270" y1="352" x2="700" y2="195" stroke="#28c840" stroke-width="2" marker-end="url(#g2)"/>
  <text x="480" y="300" font-size="9.5" fill="#8fa2c2">tools wire: the bot drives the session</text>

  <!-- legend -->
  <rect x="700" y="260" width="190" height="120" rx="10" fill="#141c30" stroke="#31405c"/>
  <text x="714" y="282" font-size="10" fill="#9fd0ff" font-weight="700">NO CODE ON YOUR SITE</text>
  <text x="714" y="302" font-size="9.5" fill="#8fa2c2">no initSpace · no snippet</text>
  <text x="714" y="318" font-size="9.5" fill="#8fa2c2">the Space + the extension are it:</text>
  <text x="714" y="334" font-size="9.5" fill="#8fa2c2">Webfuse = eyes + hands</text>
  <text x="714" y="350" font-size="9.5" fill="#8fa2c2">Pipecat = ears + brain + voice</text>
  <text x="714" y="368" font-size="9.5" fill="#8fa2c2">ngrok in the demo = a hosted wss in prod</text>
</svg>