<svg viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Architecture: customer's browser, tunnel, Pipecat bot, OpenAI, Webfuse session MCP">
  <rect width="920" height="380" fill="#0f1626"/>
  <text x="460" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#e8eefb">The moving parts — one voice wire, one tools wire</text>

  <!-- Customer's browser -->
  <rect x="30" y="70" width="280" height="170" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="170" y="94" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="700">Customer's browser — your site</text>
  <rect x="48" y="108" width="244" height="30" rx="6" fill="#24406e"/>
  <text x="170" y="128" text-anchor="middle" font-size="11" fill="#cfe0ff">page content (the Acme form)</text>
  <rect x="48" y="144" width="244" height="30" rx="6" fill="#1d3f77"/>
  <text x="170" y="163" text-anchor="middle" font-size="11" fill="#cfe0ff">🎙 agent.js — mic, Mute pill, status badge</text>
  <rect x="48" y="180" width="244" height="30" rx="6" fill="#173156"/>
  <text x="170" y="199" text-anchor="middle" font-size="11" fill="#cfe0ff">Webfuse widget + #agent-session-frame</text>
  <text x="170" y="228" text-anchor="middle" font-size="10" fill="#8fa2c2">initSpace → space.session().start("#selector")</text>

  <!-- bot.py -->
  <rect x="380" y="70" width="250" height="170" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="505" y="94" text-anchor="middle" font-size="13" fill="#cfe0ff" font-weight="700">bot.py — Pipecat pipeline (your machine)</text>
  <rect x="398" y="108" width="214" height="30" rx="6" fill="#24406e"/>
  <text x="505" y="128" text-anchor="middle" font-size="11" fill="#cfe0ff">WS voice server :8765 (single client)</text>
  <rect x="398" y="144" width="214" height="30" rx="6" fill="#1d3f77"/>
  <text x="505" y="163" text-anchor="middle" font-size="11" fill="#cfe0ff">PCMFrameSerializer + JSON control frames</text>
  <rect x="398" y="180" width="214" height="30" rx="6" fill="#173156"/>
  <text x="505" y="199" text-anchor="middle" font-size="11" fill="#cfe0ff">start_secure_session (the handoff tool)</text>
  <text x="505" y="228" text-anchor="middle" font-size="10" fill="#8fa2c2">ToolCallLogger · bind/unbind of session tools</text>

  <!-- OpenAI -->
  <rect x="700" y="70" width="190" height="76" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="795" y="94" text-anchor="middle" font-size="12" fill="#cfe0ff" font-weight="700">OpenAI Realtime</text>
  <text x="795" y="112" text-anchor="middle" font-size="10.5" fill="#8fa2c2">gpt-realtime-2.1 · reasoning minimal</text>
  <text x="795" y="128" text-anchor="middle" font-size="10.5" fill="#8fa2c2">ears + brain + voice, full duplex</text>

  <!-- Webfuse session -->
  <rect x="700" y="164" width="190" height="76" rx="12" fill="#1c2333" stroke="#31405c"/>
  <text x="795" y="188" text-anchor="middle" font-size="12" fill="#cfe0ff" font-weight="700">Webfuse session</text>
  <text x="795" y="206" text-anchor="middle" font-size="10.5" fill="#8fa2c2">cloud browser proxying the SAME page</text>
  <text x="795" y="222" text-anchor="middle" font-size="10.5" fill="#8fa2c2">embedded in the site's iframe</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4da3ff"/>
    </marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#28c840"/>
    </marker>
  </defs>
  <line x1="310" y1="120" x2="380" y2="120" stroke="#4da3ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="345" y="106" text-anchor="middle" font-size="10" fill="#8fa2c2">mic ↑ / voice ↓</text>
  <text x="345" y="146" text-anchor="middle" font-size="10" fill="#8fa2c2" font-family="monospace">bind / start_session</text>
  <line x1="310" y1="170" x2="380" y2="170" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="630" y1="105" x2="700" y2="105" stroke="#4da3ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="665" y="94" text-anchor="middle" font-size="10" fill="#8fa2c2">realtime WS</text>
  <line x1="630" y1="200" x2="700" y2="200" stroke="#28c840" stroke-width="2" marker-end="url(#g)"/>
  <text x="665" y="188" text-anchor="middle" font-size="10" fill="#8fa2c2">Session MCP (ak_)</text>

  <!-- protocol strip -->
  <rect x="30" y="280" width="860" height="70" rx="10" fill="#141c30" stroke="#31405c"/>
  <text x="50" y="304" font-size="11" fill="#9fd0ff" font-weight="700">THE WIRE — one websocket, two frame types</text>
  <text x="50" y="326" font-size="11" fill="#8fa2c2">binary = Int16 LE PCM 16 kHz mono (mic up, agent voice down)</text>
  <text x="50" y="342" font-size="11" fill="#8fa2c2" font-family="monospace">text = JSON: {"type":"start_session"} bot→page · {"type":"bind","session_id":…} page→bot</text>
  <text x="640" y="326" font-size="11" fill="#8fa2c2">customer keeps talking through the</text>
  <text x="640" y="342" font-size="11" fill="#8fa2c2">handoff — the session is just an iframe</text>
</svg>
